name: Automatic ci/cd Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash -lc '
            set -euo pipefail
      
            # Go to app directory
            cd /home/${{ secrets.SSH_USER }}/${{ secrets.SSH_PROJECTNAME }}

            # Update repo safely
            git pull origin main

            # Build new app
            npm run build        

            # Restart app with pm2
            pm2 restart ${{ secrets.SSH_PROJECTNAME }}

            # Logs
            pm2 logs
          '"
  
